name: CI

# Run on every pull request, and on pushes to main. A push to a PR branch is covered by the pull_request run, so it
# does not start a second full run of the same commit.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same ref so a fast follow-up push does not queue behind an old one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, unit tests, build, balance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Get the code.
      - uses: actions/checkout@v4

      # Bun runs the tests, the build script and the headless balance script.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      # The repo has no npm dependencies (and no typescript devDependency), so install the compiler
      # globally. `bun run typecheck` then runs the same `tsc --noEmit -p .` as it does locally.
      - name: Install TypeScript
        run: npm install -g typescript@5

      # Static type check of src/.
      - name: Typecheck
        run: bun run typecheck

      # Deterministic sim and meta-layer unit tests.
      - name: Unit tests
        run: bun test

      # Bundle everything into dist/index.html.
      - name: Build
        run: bun run build

      # Fails if dist/index.html grows past its size budget (scripts/size-budget.ts) and prints the size.
      - name: Page size budget
        run: bun run size

      # Headless CPU-vs-CPU matches. --assert fails the job if goals/match leaves 1.5 to 6
      # or passes/match drops below 80, which catches broken sim tuning.
      - name: Balance smoke test
        run: bun run balance 20 --assert

      # Keep the playable single-file build so reviewers can download and open it.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: derby-day-dist
          path: dist/index.html
          if-no-files-found: error

  # The suite is about 20 minutes on one runner (3D under SwiftShader, and the perf tests play several matches back to back),
  # so it runs as three parallel jobs, each a third of the test files balanced by recorded time (tests/e2e/shard-weights.json,
  # tests/e2e/lib/shard.cjs; tests/shard.test.ts proves every file runs in exactly one shard).
  e2e:
    name: Browser end-to-end tests (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Get the code.
      - uses: actions/checkout@v4

      # Bun builds the game (`bun run e2e` builds first).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      # Playwright is deliberately not a repo dependency; install it globally instead.
      - name: Install Playwright
        run: npm install -g playwright@1

      # Download Chromium plus the system libraries it needs on a fresh runner. Using the global
      # `playwright` binary guarantees the browser matches the library the runner loads.
      - name: Install Chromium
        run: playwright install --with-deps chromium

      # The runner does require('playwright'); point Node at the global npm root so it resolves.
      # PLAYWRIGHT_CHROMIUM is unset here, so Playwright uses the browser installed above.
      - name: Run e2e tests (shard ${{ matrix.shard }} of 3)
        env:
          E2E_SHARD: ${{ matrix.shard }}/3
        run: |
          export NODE_PATH="$(npm root -g)"
          bun run e2e

  # One check under the name the branch protection already knows: green only when every shard is green.
  e2e-all:
    name: Browser end-to-end tests
    needs: e2e
    # Not always(): a cancelled workflow (a newer push superseded it) skips this job instead of posting a red check.
    # A shard that fails or is skipped still runs it, and it fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "e2e shards: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = "success"
