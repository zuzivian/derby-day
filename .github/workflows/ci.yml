name: CI

# Run on every pull request, and on pushes to main. A push to a PR branch is covered by the pull_request run, so it
# does not start a second full run of the same commit.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same ref so a fast follow-up push does not queue behind an old one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck, build and the headless sim guards. The unit tests run beside it in the unit jobs below.
  build:
    name: Typecheck, build, balance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Get the code.
      - uses: actions/checkout@v4

      # Bun runs the build script and the headless balance and career scripts.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      # The repo has no npm dependencies (and no typescript devDependency), so install the compiler
      # globally. `bun run typecheck` then runs the same `tsc --noEmit -p .` as it does locally.
      - name: Install TypeScript
        run: npm install -g typescript@5

      # Static type check of src/.
      - name: Typecheck
        run: bun run typecheck

      # Bundle everything into dist/index.html.
      - name: Build
        run: bun run build

      # Fails if dist/index.html grows past its size budget (scripts/size-budget.ts) and prints the size.
      - name: Page size budget
        run: bun run size

      # Headless CPU-vs-CPU matches. --assert fails the job if goals/match leaves 1.5 to 6
      # or passes/match drops below 80, which catches broken sim tuning. 60 matches: the mean is
      # about 1.7-1.9 goals, so 20 (standard error about 0.33) failed or passed on the luck of the seeds.
      - name: Balance smoke test
        run: bun run balance 60 --assert

      # A deterministic headless career to level 99 (about 15 s). --assert fails the job if the
      # pacing to levels 5-99, the world's strength at the top, cup and league rewards against
      # ranked, promotions or the save size leave their bands (scripts/career.ts).
      - name: Career simulator
        run: bun run career --assert

      # Keep the playable single-file build so reviewers can download and open it.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: derby-day-dist
          path: dist/index.html
          if-no-files-found: error

  # Deterministic sim and meta-layer unit tests, as two jobs of test files balanced by recorded seconds per file
  # (tests/unit-weights.json, scripts/unit-shard.ts; tests/shard.test.ts proves every file runs in exactly one).
  unit:
    name: Unit tests (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Unit tests (shard ${{ matrix.shard }} of 2)
        run: bun test $(bun run scripts/unit-shard.ts ${{ matrix.shard }}/2)

  # One check under the name the branch protection already knows: green only when the build job and every unit shard are.
  check:
    name: Typecheck, unit tests, build, balance
    needs: [build, unit]
    # As for e2e-all: a cancelled workflow skips this instead of posting a red check; a failed or skipped job still fails it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Build and every unit shard passed
        run: |
          echo "build: ${{ needs.build.result }}, unit shards: ${{ needs.unit.result }}"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"

  fairness:
    name: Fair matches for every kind of player
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Get the code.
      - uses: actions/checkout@v4

      # Bun runs the headless fairness harness.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      # Scripted humans (passive to strong) play new-club careers through the real sim, with the
      # CPU's skill from the hidden estimate. --assert fails the job when a target is missed: a
      # passive human routed, a competent one far from an even chance, a strong one not winning
      # most, or the win chance shown drifting from the one measured (scripts/fairness.ts).
      - name: Fairness check
        run: bun run fairness 12 --assert

  # The suite is about half an hour on one runner (3D under SwiftShader, and the perf tests play several matches back to back),
  # so it runs as six parallel jobs, each a sixth of the tests balanced by recorded time per test (tests/e2e/shard-weights.json,
  # tests/e2e/lib/shard.cjs; tests/shard.test.ts proves every test runs in exactly one shard). By test, not by file: perf.e2e.cjs
  # alone is about ten minutes.
  e2e:
    name: Browser end-to-end tests (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    # "Install Chromium" has taken 6-7 min on a slow apt mirror (the system packages, not the browser download), which once
    # cut off a shard in the second its tests finished.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # Get the code.
      - uses: actions/checkout@v4

      # Bun builds the game (`bun run e2e` builds first).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      # Playwright is deliberately not a repo dependency; install it globally instead.
      - name: Install Playwright
        run: npm install -g playwright@1

      # Download the headless Chromium shell (the runner launches headless, which uses it) plus the system libraries it needs
      # on a fresh runner; not the full browser as well. Using the global `playwright` binary guarantees the browser matches
      # the library the runner loads.
      - name: Install Chromium
        run: playwright install --with-deps --only-shell chromium

      # The runner does require('playwright'); point Node at the global npm root so it resolves.
      # PLAYWRIGHT_CHROMIUM is unset here, so Playwright uses the browser installed above.
      - name: Run e2e tests (shard ${{ matrix.shard }} of 6)
        env:
          E2E_SHARD: ${{ matrix.shard }}/6
          E2E_TIMINGS_FILE: e2e-timings-${{ matrix.shard }}.json
        run: |
          export NODE_PATH="$(npm root -g)"
          bun run e2e

      # Seconds per test, to refresh tests/e2e/shard-weights.json: node tests/e2e/weights.cjs e2e-timings-*.json
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings-${{ matrix.shard }}
          path: e2e-timings-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # One check under the name the branch protection already knows: green only when every shard is green.
  e2e-all:
    name: Browser end-to-end tests
    needs: e2e
    # Not always(): a cancelled workflow (a newer push superseded it) skips this job instead of posting a red check.
    # A shard that fails or is skipped still runs it, and it fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "e2e shards: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = "success"
